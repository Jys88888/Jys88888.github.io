<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>免费AI聊天 - 奔跑的乌龟</title>
  <!-- ============================================================
       免费 AI 聊天工具（多平台版）
       支持：智谱（GLM-4-Flash 永久免费）/ 硅基流动（91+ 模型，低价）/ 自定义
       密钥只存在你自己的浏览器里，不会上传到任何服务器
       想改功能：用 Cursor 打开本文件，告诉 AI 你想改什么。
       ============================================================ -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: #f0f6ff;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部 */
    .header {
      background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 55%, #e0e7ff 100%);
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header h1 {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #0284c7, #06b6d4, #6366f1);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header .actions { display: flex; gap: 8px; }

    /* 设置面板 */
    .settings {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 20px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .settings.open { max-height: 460px; padding: 16px 20px; }

    .settings label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
      margin: 10px 0 4px;
    }

    .settings input[type="password"], .settings input[type="text"], .settings select {
      width: 100%;
      max-width: 480px;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      background: #f8fafc;
    }

    .settings input:focus, .settings select:focus {
      outline: none;
      border-color: #0ea5e9;
      background: #ffffff;
    }

    .settings .note { font-size: 0.78rem; color: #94a3b8; margin-top: 8px; line-height: 1.8; }

    /* 聊天区 */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .msg {
      display: flex;
      margin-bottom: 16px;
      animation: fadeIn 0.25s ease;
    }

    .msg.user { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: #0284c7;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .bubble {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.06);
    }

    .msg .role-tag {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-right: 8px;
      align-self: flex-end;
      padding-bottom: 4px;
    }

    .msg.user .role-tag { margin-right: 0; margin-left: 8px; }

    .welcome {
      text-align: center;
      color: #94a3b8;
      padding: 60px 20px;
      font-size: 0.95rem;
      line-height: 2;
    }

    .welcome.hide { display: none; }

    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .thinking .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #0ea5e9;
      animation: blink 1s infinite;
    }
    .thinking .dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

    /* 输入区 */
    .input-bar {
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
      padding: 12px 20px 16px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-bar textarea {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      height: 46px;
      max-height: 140px;
      background: #f8fafc;
    }

    .input-bar textarea:focus { outline: none; border-color: #0ea5e9; background: #ffffff; }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      background: #0284c7;
      color: #ffffff;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: #e0f2fe;
      color: #0369a1;
      padding: 12px 16px;
    }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 99;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    footer {
      text-align: center;
      padding: 8px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>💬 免费 AI 聊天</h1>
    <div class="actions">
      <button class="btn btn-ghost" onclick="toggleSettings()">⚙️ 设置密钥</button>
      <button class="btn btn-ghost" onclick="clearChat()">🗑️ 清空对话</button>
    </div>
  </div>

  <!-- 设置面板 -->
  <div class="settings" id="settings">
    <label>① 选择平台</label>
    <select id="platform" onchange="onPlatformChange()">
      <option value="zhipu">智谱（GLM-4-Flash 永久免费，推荐）</option>
      <option value="siliconflow">硅基流动（91 个模型，低价）</option>
      <option value="custom">自定义接口（高级）</option>
    </select>
    <div id="customBaseWrap" style="display:none;">
      <label>自定义接口地址</label>
      <input type="text" id="customBase" placeholder="例如 https://api.xxx.com/v1">
    </div>
    <label>② 你的 API 密钥</label>
    <input type="password" id="apiKey" placeholder="粘贴 sk- 开头的密钥">
    <label>③ 选择模型（点下面按钮刷新列表）</label>
    <select id="modelSelect"><option value="">（先填密钥再加载模型）</option></select>
    <div style="margin-top:10px;">
      <button class="btn" style="padding:8px 18px;font-size:0.85rem;" onclick="saveSettings()">💾 保存并加载模型</button>
      <button class="btn btn-ghost" style="padding:8px 18px;font-size:0.85rem;" onclick="loadModels()">🔄 刷新模型列表</button>
    </div>
    <div class="note">
      🔒 密钥只保存在你自己的浏览器里，不会上传到任何服务器。<br>
      💡 想永久免费：选「智谱」，去 open.bigmodel.cn 注册（手机号即可），GLM-4-Flash 官方长期免费。<br>
      💡 想用 DeepSeek 等：选「硅基流动」，充值 1 元能用很久（低价付费）。
    </div>
  </div>

  <!-- 聊天区 -->
  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      你好！我是你的免费 AI 助手 🤖<br>
      👉 先点右上角「⚙️ 设置密钥」，选平台、填密钥、加载模型<br>
      然后就可以开始聊天了<br>
      <span style="font-size:0.85rem;color:#cbd5e1">💡 推荐「智谱」平台：GLM-4-Flash 永久免费</span>
    </div>
  </div>

  <!-- 输入区 -->
  <div class="input-bar">
    <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" onkeydown="onKey(event)"></textarea>
    <button class="btn" id="sendBtn" onclick="send()">发送</button>
  </div>

  <footer>💬 免费AI聊天 · 奔跑的乌龟出品 · 密钥不出浏览器</footer>
  <div class="toast" id="toast"></div>

  <script>
    // ============================================================
    // 逻辑部分：多平台 AI 聊天
    // ============================================================

    const chatEl = document.getElementById('chat');
    const welcomeEl = document.getElementById('welcome');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const keyInput = document.getElementById('apiKey');
    const modelSelect = document.getElementById('modelSelect');
    const platformSelect = document.getElementById('platform');
    const customBaseInput = document.getElementById('customBase');

    let messages = [];
    let busy = false;

    // ---------- 本地存储 ----------
    function getKey() { return localStorage.getItem('ai_key') || ''; }
    function saveKey(k) { localStorage.setItem('ai_key', k); }
    function getPlatform() { return localStorage.getItem('ai_platform') || 'zhipu'; }
    function getCustomBase() { return localStorage.getItem('ai_custom_base') || ''; }

    // 根据平台得到接口地址
    function getBase() {
      const p = getPlatform();
      if (p === 'siliconflow') return 'https://api.siliconflow.cn/v1';
      if (p === 'zhipu') return 'https://open.bigmodel.cn/api/paas/v4';
      return getCustomBase() || 'https://api.siliconflow.cn/v1';
    }

    function onPlatformChange() {
      const p = platformSelect.value;
      document.getElementById('customBaseWrap').style.display = p === 'custom' ? 'block' : 'none';
      if (p === 'custom') customBaseInput.value = getCustomBase();
      if (getKey()) loadModels();
    }

    // ---------- 加载模型列表 ----------
    async function loadModels() {
      const key = getKey();
      if (!key) { showToast('⚠️ 请先填写密钥'); return; }
      try {
        const r = await fetch(getBase() + '/models', {
          headers: { Authorization: 'Bearer ' + key }
        });
        if (r.status === 401) { showToast('❌ 密钥无效，请检查是否复制完整'); return; }
        if (!r.ok) { showToast('❌ 加载失败: HTTP ' + r.status); return; }
        const b = await r.json();
        const models = (b.data || []).map(x => x.id);
        if (models.length === 0) { showToast('❌ 平台没有返回模型列表'); return; }
        modelSelect.innerHTML = '';
        models.forEach(id => {
          const opt = document.createElement('option');
          opt.value = id;
          const isFree = /flash|free|glm-4-9b|qwen2\.5-7b|ernie-speed/i.test(id);
          opt.textContent = id + (isFree ? '（可能免费）' : '');
          modelSelect.appendChild(opt);
        });
        // 默认选免费/轻量模型
        const def = models.find(id => /glm-4-flash|glm-4-9b|deepseek-v4-flash|qwen2\.5-7b/i.test(id)) || models[0];
        if (def) modelSelect.value = def;
        showToast('✅ 已加载 ' + models.length + ' 个模型');
        return true;
      } catch (e) {
        showToast('❌ 网络错误: ' + e.message);
        return false;
      }
    }

    // ---------- 保存设置 ----------
    function saveSettings() {
      const k = keyInput.value.trim();
      if (k) saveKey(k);
      localStorage.setItem('ai_platform', platformSelect.value);
      if (platformSelect.value === 'custom' && customBaseInput.value.trim()) {
        localStorage.setItem('ai_custom_base', customBaseInput.value.trim());
      }
      showToast('✅ 设置已保存（只存在本浏览器）');
      loadModels();
      toggleSettings(false);
    }

    function toggleSettings(force) {
      const s = document.getElementById('settings');
      const shouldOpen = force !== undefined ? force : !s.classList.contains('open');
      s.classList.toggle('open', shouldOpen);
      if (shouldOpen) {
        keyInput.value = getKey();
        platformSelect.value = getPlatform();
        onPlatformChange();
      }
    }

    // ---------- 渲染消息 ----------
    function addMsg(role, text) {
      welcomeEl.classList.add('hide');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      const tag = document.createElement('span');
      tag.className = 'role-tag';
      tag.textContent = role === 'user' ? '我' : 'AI';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      div.appendChild(role === 'user' ? bubble : tag);
      div.appendChild(role === 'user' ? tag : bubble);
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return bubble;
    }

    function showThinking() {
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.id = 'thinkingMsg';
      const tag = document.createElement('span');
      tag.className = 'role-tag';
      tag.textContent = 'AI';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
      div.appendChild(tag);
      div.appendChild(bubble);
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function removeThinking() {
      const t = document.getElementById('thinkingMsg');
      if (t) t.remove();
    }

    // ---------- 发送消息 ----------
    async function send() {
      if (busy) return;
      const text = inputEl.value.trim();
      if (!text) return;
      const key = getKey();
      if (!key) { showToast('⚠️ 请先点右上角「⚙️ 设置密钥」'); toggleSettings(true); return; }
      const model = modelSelect.value;
      if (!model) { showToast('⚠️ 请先保存设置并加载模型'); return; }

      messages.push({ role: 'user', content: text });
      addMsg('user', text);
      inputEl.value = '';
      busy = true;
      sendBtn.disabled = true;
      showThinking();

      try {
        const r = await fetch(getBase() + '/chat/completions', {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + key,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model,
            messages: messages,
            max_tokens: 2000,
            temperature: 0.7
          })
        });
        const b = await r.json();
        removeThinking();

        if (!r.ok) {
          if (r.status === 401) {
            showToast('❌ 密钥无效，请检查是否复制完整');
            messages.pop();
          } else if (r.status === 402) {
            showToast('❌ 账户余额不足：换「智谱」平台用免费模型，或在平台充值');
            messages.pop();
          } else if (r.status === 429) {
            showToast('⏳ 请求太频繁（限速），等 1 分钟再试');
          } else {
            const msg = (b.message || b.error || {}).message || ('HTTP ' + r.status);
            showToast('❌ 出错了: ' + msg);
            messages.pop();
          }
          return;
        }

        const reply = (b.choices && b.choices[0] && b.choices[0].message.content) || '(模型没有返回内容)';
        messages.push({ role: 'assistant', content: reply });
        addMsg('assistant', reply);
      } catch (e) {
        removeThinking();
        showToast('❌ 网络错误: ' + e.message);
      } finally {
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function onKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    }

    function clearChat() {
      messages = [];
      chatEl.querySelectorAll('.msg').forEach(m => m.remove());
      welcomeEl.classList.remove('hide');
      showToast('🗑️ 对话已清空');
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // 页面打开：恢复设置，有密钥就加载模型
    platformSelect.value = getPlatform();
    onPlatformChange();
    if (getKey()) loadModels();
  </script>
</body>
</html>
